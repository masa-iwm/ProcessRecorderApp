# 配布物の作成（非同梱 / 同梱 MinGW / 同梱 MSVC の3形態。どれも Native AOT 発行）。
#
# なぜ build.yml と分けるか: ここは同梱用の GStreamer を毎回取ってくるので、
# push のたびに走らせる価値が無い。build.yml は「壊れていないこと」、こちらは
# 「配れるものを作ること」が目的。
#
# 発行は win-x64-aot プロファイル（build.yml の publish-aot ジョブと同じ形態）。
# 配布物は AOT 版のみ ── selfcontained(ReadyToRun) は CI の検証用で、配布しない。
#
# 3形態:
#   - 非同梱     （`ProcessRecorderApp-<tag>-win-x64.zip`）
#       利用者側に GStreamer(MinGW/MSVC) か MSYS2(UCRT64) が要る。軽い。
#   - 同梱 MinGW （`ProcessRecorderApp-<tag>-win-x64-gstreamer-mingw.zip`）
#       削減した runtimes（46 ファイル・49.9MB）を同梱する。**自己完結** ──
#       libstdc++ / libgcc / libwinpthread も入る。
#   - 同梱 MSVC  （`ProcessRecorderApp-<tag>-win-x64-gstreamer-msvc.zip`）
#       同じ選択の MSVC ビルド（44 ファイル・24.6MB）。小さく、画面キャプチャ 2 種
#       （`d3d12screencapturesrc` / `d3d11screencapturesrc`）に `capture-api`（WGC）が
#       生えるが、**利用者の機械に VC++ 再頒布可能パッケージが要る**
#       （`msvcp140` / `vcruntime140` / `vcruntime140_1` は同梱していない）。
#
#   同梱版はどちらも **x264 と libav を含まないので GPL を持ち込まない。** Type=System は
#   `mfh264enc` に落ちる（**openh264 は特許の都合で同梱しない** ── THIRD-PARTY-NOTICES.md「2.」。
#   GPU 実機検証で、System の自動選択が `mfh264enc` を選んで有効な MP4 を出すことは
#   **両形態とも**観測済み ── docs/gpu-verification.md）。
#
# **同梱物の検証はここでしかできない。** 開発機には GStreamer が入っており、
# 解決順（元の PATH → 環境変数 → レジストリ → 既定の導入先 → MSYS2 → 同梱物）の
# 都合で同梱物は必ず負ける。このジョブは MSYS2 を入れないので、
# ランナーでは同梱物が唯一の当たりになり `selected=BundledRuntime` を実際に踏める。
# ただし流せるのは**エンコーダーに依存しないケースだけ** ── L2 のハーネスは
# `SettingsFile.DefaultEncoder = "x264enc"` を固定しており、同梱物に x264 は無い。
#
# **MSVC 版の「VC++ 再頒布可能パッケージが要る」という前提は、ここでは踏めない。**
# windows-latest には Visual Studio が入っているので CRT は必ず在る。緑を
# 「入っていなくても動く」の根拠にしないこと（THIRD-PARTY-NOTICES.md「4.」）。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  # 同梱用ランタイムの置き場。形態ごとに Release アセット（prerelease）として上げてある。
  # tools/Fetch-GStreamerRuntime.ps1 の $assets と揃えること（更新手順は docs/runtime-update.md）。
  # 中身は licenses/third-party/COMPONENTS*.tsv が正本で、下の検証がそれと突き合わせる。
  GSTREAMER_RUNTIME_TAG: 'gstreamer-runtime-v1.28.6-r2'
  GSTREAMER_RUNTIME_ASSET: 'gstreamer-runtime-win-x64-v1.28.6-r2.zip'
  GSTREAMER_RUNTIME_TAG_MSVC: 'gstreamer-runtime-msvc-v1.28.6'
  GSTREAMER_RUNTIME_ASSET_MSVC: 'gstreamer-runtime-msvc-win-x64-v1.28.6.zip'

jobs:
  package:
    runs-on: windows-latest
    # AOT のネイティブリンクを3回（非同梱・同梱 MinGW・同梱 MSVC）行うため、厚めに取る。
    timeout-minutes: 120
    permissions:
      contents: write     # Release にアセットを添付するため（同梱ランタイムの取得もこれで足りる）

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # zip の名前に入れる文字列。タグからの実行では ref_name がそのままタグ名になるが、
      # **workflow_dispatch でブランチから流すと `feature/xxx` のように `/` を含む**
      # ── そのまま DestinationPath に入れると存在しないディレクトリを指し、
      # Compress-Archive が落ちる。
      - name: Compute the package name
        run: |
          $name = '${{ github.ref_name }}' -replace '[\\/]', '-'
          "PKG_REF=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "package name segment: $name"

      # --- 非同梱 ---------------------------------------------------------
      # 明示的に false を渡す。既定は「runtimes/ に本体 DLL があれば同梱」なので、
      # 取得ステップの後に発行順が入れ替わると黙って同梱版になる。
      # AOT のネイティブリンクに要る MSVC / vswhere は windows-latest では標準の場所で
      # 解決される（win-x64-aot.pubxml のコメントを参照）。
      - name: Publish (Native AOT, without GStreamer)
        run: >
          dotnet publish src/ProcessRecorderApp/ProcessRecorderApp.csproj
          -p:PublishProfile=win-x64-aot
          -p:BundleGStreamerRuntime=false

      - name: Package (without GStreamer)
        run: |
          $dir = 'src/ProcessRecorderApp/bin/Release/win-x64/publish/aot'
          if (Test-Path "$dir/runtimes") { throw "expected no bundled runtime under $dir" }
          # 本体のライセンスは配布形態によらず入る。第三者の分は入らない
          # ── 非同梱版はそれらを1つも含まないため。
          foreach ($f in @('license.txt', 'THIRD-PARTY-NOTICES.md')) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "not in the package: $f" }
          }
          if (Test-Path "$dir/licenses/third-party") { throw "third-party licenses in the non-bundled package" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path "$dir/*" -DestinationPath "artifacts/ProcessRecorderApp-$env:PKG_REF-win-x64.zip"

      # --- 同梱 MinGW -----------------------------------------------------
      # 取得先は毎回 runtimes/win-x64 の**同じ場所**で、Fetch は展開前に空にする。
      # したがって MinGW と MSVC は順番に処理するしかない（混ざった木のプラグインは
      # 黙って blacklist される ── csproj の VerifyGStreamerRuntimeFlavor が止める）。
      - name: Fetch the bundled GStreamer runtime (MinGW)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:GSTREAMER_RUNTIME_TAG -p $env:GSTREAMER_RUNTIME_ASSET -D $env:RUNNER_TEMP
          ./tools/Fetch-GStreamerRuntime.ps1 -Flavor mingw -ArchivePath (Join-Path $env:RUNNER_TEMP $env:GSTREAMER_RUNTIME_ASSET)

      - name: Publish (Native AOT, with GStreamer MinGW)
        run: >
          dotnet publish src/ProcessRecorderApp/ProcessRecorderApp.csproj
          -p:PublishProfile=win-x64-aot
          -p:BundleGStreamerRuntime=true
          -p:PublishDir=bin\Release\win-x64\publish\bundled\

      # 「同梱版」を名乗ったまま中身が無い zip を配らない。
      #
      # 件数の下限ではなく **その形態の台帳と過不足なく一致すること**を見る。
      # 下限では「多い分」を捕まえられず、ライセンス文の無いものが黙って混ざる。
      # 件数の下限に戻さないこと ── 同梱物の構成を変えるたびに下限値が古くなり、
      # 正しい構成を弾くようになる。
      #
      # **ここが「配布物にライセンス文が入っている」ことを見る唯一の場所である。**
      # L1（ThirdPartyLicenseTests）が見られるのはリポジトリ内の整合だけ。
      # 中身は tools/Verify-BundledPublish.ps1 ── 形態ごとに書き写すと必ず片方が古くなる。
      - name: Verify the bundled output (MinGW)
        run: >
          ./tools/Verify-BundledPublish.ps1
          -PublishDir src/ProcessRecorderApp/bin/Release/win-x64/publish/bundled
          -Ledger licenses/third-party/COMPONENTS.tsv

      # このジョブは MSYS2 を入れていないので、同梱物が唯一の当たりになる。
      # ここが `selected=BundledRuntime` を実際に踏む唯一の場所（上の冒頭コメントを参照）。
      - name: Smoke-test the bundled build (MinGW)
        env:
          PROCESSRECORDERAPP_E2E_PUBLISH_DIR: ${{ github.workspace }}/src/ProcessRecorderApp/bin/Release/win-x64/publish/bundled
          PROCESSRECORDERAPP_E2E_KEEP: '1'
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: >
          dotnet test tests/ProcessRecorderApp.E2E
          -c Release
          --filter "FullyQualifiedName~SmokeTests|FullyQualifiedName~RuntimeResolutionTests"
          --logger "trx;LogFileName=release-smoke-mingw.trx"

      - name: Verify the smoke test actually selected its tests (MinGW)
        run: ./tools/Assert-SmokeSelection.ps1 -TrxName release-smoke-mingw.trx

      - name: Package (with GStreamer MinGW)
        run: |
          $dir = 'src/ProcessRecorderApp/bin/Release/win-x64/publish/bundled'
          Compress-Archive -Path "$dir/*" -DestinationPath "artifacts/ProcessRecorderApp-$env:PKG_REF-win-x64-gstreamer-mingw.zip"

      # --- 同梱 MSVC ------------------------------------------------------
      - name: Fetch the bundled GStreamer runtime (MSVC)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:GSTREAMER_RUNTIME_TAG_MSVC -p $env:GSTREAMER_RUNTIME_ASSET_MSVC -D $env:RUNNER_TEMP
          ./tools/Fetch-GStreamerRuntime.ps1 -Flavor msvc -ArchivePath (Join-Path $env:RUNNER_TEMP $env:GSTREAMER_RUNTIME_ASSET_MSVC)

      - name: Publish (Native AOT, with GStreamer MSVC)
        run: >
          dotnet publish src/ProcessRecorderApp/ProcessRecorderApp.csproj
          -p:PublishProfile=win-x64-aot
          -p:BundleGStreamerRuntime=true
          -p:PublishDir=bin\Release\win-x64\publish\bundled-msvc\

      - name: Verify the bundled output (MSVC)
        run: >
          ./tools/Verify-BundledPublish.ps1
          -PublishDir src/ProcessRecorderApp/bin/Release/win-x64/publish/bundled-msvc
          -Ledger licenses/third-party/COMPONENTS-msvc.tsv

      - name: Smoke-test the bundled build (MSVC)
        env:
          PROCESSRECORDERAPP_E2E_PUBLISH_DIR: ${{ github.workspace }}/src/ProcessRecorderApp/bin/Release/win-x64/publish/bundled-msvc
          PROCESSRECORDERAPP_E2E_KEEP: '1'
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: >
          dotnet test tests/ProcessRecorderApp.E2E
          -c Release
          --filter "FullyQualifiedName~SmokeTests|FullyQualifiedName~RuntimeResolutionTests"
          --logger "trx;LogFileName=release-smoke-msvc.trx"

      - name: Verify the smoke test actually selected its tests (MSVC)
        run: ./tools/Assert-SmokeSelection.ps1 -TrxName release-smoke-msvc.trx

      - name: Package (with GStreamer MSVC)
        run: |
          $dir = 'src/ProcessRecorderApp/bin/Release/win-x64/publish/bundled-msvc'
          Compress-Archive -Path "$dir/*" -DestinationPath "artifacts/ProcessRecorderApp-$env:PKG_REF-win-x64-gstreamer-msvc.zip"

      # ここだけ ignore ではなく error にする。診断の収集と違って、
      # **配布する zip が 1 つも無いのは異常**であり、既定の warn では
      # 「緑のまま中身が空の Release」を作ってしまう。
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} artifacts/*.zip --clobber

      - name: Upload smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-diagnostics
          path: |
            ${{ runner.temp }}/pra-e2e-*/*.log
            ${{ runner.temp }}/pra-e2e-*/*.json
            **/TestResults/*.trx
          if-no-files-found: ignore
